services:
  scdl:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:bullseye}
        TZ: ${TZ:-America/New_York}
    image: ${IMAGE_NAME:-soundcloud-downloader:latest}
    container_name: soundcloud-downloader
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: host
    privileged: true
    volumes:
      - ${MUSIC_PATH:-/home/krusty/Music/soundcloud}:/Music/SoundCloud/${SCDL_USERNAME:-krusty}
      - ~/.config/scdl:/root/.config/scdl
    environment:
      - TZ=${TZ:-America/New_York}
      - SCDL_USERNAME=${SCDL_USERNAME:-krusty}
      - SCDL_URL=${SCDL_URL:-https://soundcloud.com/krusty}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
